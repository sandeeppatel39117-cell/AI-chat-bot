
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI Chatbot</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 95%;
            max-width: 700px;
            height: 80vh;
            min-height: 400px;
            background: white;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 5px 25px #0002;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
        }

        header h2 { margin: 0 0 5px; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .user {
            background: #dbeafe;
            margin-left: 35px;
        }

        .bot {
            background: #f1f5f9;
            margin-right: 35px;
        }

        form {
            display: flex;
            gap: 8px;
            padding: 14px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            color: white;
            background: #2563eb;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; }


        
/* AI response formatting */
.bot {
    background: #f1f5f9;
    margin-right: 20px;
    padding: 18px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.bot h1, .bot h2, .bot h3 {
    color: #172554;
    margin: 18px 0 10px;
    line-height: 1.3;
}

.bot h1 { font-size: 1.5rem; }
.bot h2 { font-size: 1.25rem; }
.bot h3 { font-size: 1.1rem; }

.bot p {
    margin: 10px 0;
}

.bot ul, .bot ol {
    padding-left: 25px;
    margin: 10px 0;
}

.bot li {
    margin: 5px 0;
}

.bot strong {
    color: #172554;
}

.bot table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    display: block;
    overflow-x: auto;
}

.bot th, .bot td {
    border: 1px solid #cbd5e1;
    padding: 10px;
    text-align: left;
    min-width: 100px;
}

.bot th {
    background: #dbeafe;
}

.bot pre {
    background: #0f172a;
    color: #f8fafc;
    padding: 14px;
    border-radius: 8px;
    overflow-x: auto;
}

.bot pre code {
    color: inherit;
    background: transparent;
}

.bot :not(pre) > code {
    background: #e2e8f0;
    padding: 2px 5px;
    border-radius: 4px;
}

.bot a {
    color: #2563eb;
    overflow-wrap: anywhere;
}

.bot blockquote {
    border-left: 4px solid #60a5fa;
    padding-left: 12px;
    margin-left: 0;
    color: #475569;
}

    </style>


<!-- Markdown formatting -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Security: sanitize generated HTML -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>

<body>
<div class="chat-container">
    <header>
        <h2>Groq AI Chatbot</h2>
        <div>Ask me anything</div>
    </header>

    <div id="messages" aria-live="polite">
        <div class="message bot">Hello! How can I help you?</div>
    </div>

    <form id="chat-form">
        {% csrf_token %}
        <input
            id="message-input"
            type="text"
            placeholder="Type your message..."
            maxlength="4000"
            required
            autocomplete="off"
        >
        <button id="send-button" type="submit">Send</button>
    </form>
</div>

<script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const messages = document.getElementById("messages");
    const button = document.getElementById("send-button");

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = "message " + type;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const message = input.value.trim();
        if (!message || button.disabled) return;

        addMessage(message, "user");
        input.value = "";
        button.disabled = true;

        const loading = addMessage("Thinking...", "bot");

        try {
            const csrfToken = document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;

            const response = await fetch("/chat/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
          
if (response.ok) {
    // Render Markdown as formatted HTML, then sanitize it.
    loading.innerHTML = DOMPurify.sanitize(
        marked.parse(data.reply || "No response received.")
    );
} else {
    // Errors remain plain text.
    loading.textContent =
        data.error || "Something went wrong.";
}


        } catch (error) {
            loading.textContent =
                "Could not connect to the server. Please try again.";
        } finally {
            button.disabled = false;
            input.focus();
        }
    });
</script>
</body>
</html>
