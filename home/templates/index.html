<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d12">
    <title>Groq AI Chatbot</title>

    <!-- Markdown rendering and sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --bg: #0b0d12;
            --sidebar: #11141b;
            --panel: #191c25;
            --border: #292d38;
            --text: #f1f3f9;
            --muted: #969eaf;
            --accent: #8b78ff;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
        }

        button, input { font: inherit; }

        .app-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Left sidebar */
        .sidebar {
            width: 265px;
            flex: 0 0 265px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 20px 14px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            min-height: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 7px;
            font-size: 18px;
            font-weight: 700;
        }

        .brand-logo, .logo {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 13px;
            font-size: 22px;
            color: white;
            background: linear-gradient(135deg, #9878ff, #526bff);
        }

        .new-chat {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 12px;
            text-align: left;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #1b1e28;
            color: var(--text);
            cursor: pointer;
            transition: background .2s;
        }

        .new-chat:hover, .history-item:hover { background: #252936; }

        .history-heading {
            margin: 0 8px -10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .chat-history {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #454958 transparent;
        }

        .history-item {
            width: 100%;
            display: block;
            padding: 11px 10px;
            margin-bottom: 4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            text-align: left;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
        }

        .history-item.active { background: #29243e; }

        .empty-history {
            padding: 8px;
            color: #737c8e;
            font-size: 12px;
            line-height: 1.6;
        }

        .sidebar-footer {
            padding: 12px 7px 0;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        /* Main chat */
        .chat-container {
            flex: 1;
            width: 0;
            min-width: 0;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 15px 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .sidebar-toggle {
            display: none;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
        }

        .header-info { flex: 1; min-width: 0; }

        header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 650;
        }

        .subtitle {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        /* Only the messages pane scrolls */
        #messages {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 30px 24px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #454958 transparent;
        }

        .message {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            animation: appear .2s ease;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 35px;
            height: 35px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 16px;
        }

        .bot .avatar { background: linear-gradient(135deg, #8b5cf6, #4169e1); }
        .user .avatar { background: #303440; }

        .bubble {
            min-width: 0;
            max-width: calc(100% - 49px);
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--panel);
            color: var(--text);
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .bot .bubble {
            flex: 1;
            padding: 3px 0;
            border-color: transparent;
            background: transparent;
        }

        .user { flex-direction: row-reverse; }

        .user .bubble {
            border-color: #454064;
            border-radius: 18px 5px 18px 18px;
            background: #27233b;
        }

        .bubble p:first-child { margin-top: 0; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble h1, .bubble h2, .bubble h3 {
            color: #c7baff;
            line-height: 1.4;
        }

        .bubble a { color: #a5c8ff; overflow-wrap: anywhere; }

        .bubble pre {
            max-width: 100%;
            overflow-x: auto;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #090b10;
        }

        .bubble code { font-family: Consolas, "Courier New", monospace; font-size: .92em; }

        .bubble :not(pre) > code {
            padding: 3px 6px;
            border-radius: 5px;
            background: #292d3b;
            color: #c4b5fd;
        }

        .bubble table {
            display: block;
            max-width: 100%;
            overflow-x: auto;
            border-collapse: collapse;
        }

        .bubble th, .bubble td {
            min-width: 80px;
            padding: 9px;
            border: 1px solid #3a4050;
            text-align: left;
        }

        .bubble th { background: #242938; }

        .typing { display: inline-flex; gap: 5px; padding: 5px 2px; }
        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: .5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Composer stays at the bottom */
        .input-area {
            flex-shrink: 0;
            width: 100%;
            padding: 14px 24px 12px;
            background: var(--bg);
        }

        #chat-form {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 9px;
            border: 1px solid #393d49;
            border-radius: 18px;
            background: #191c25;
            transition: border-color .2s, box-shadow .2s;
        }

        #chat-form:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #8b78ff18;
        }

        #message-input {
            flex: 1;
            min-width: 0;
            padding: 13px 12px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font: inherit;
            font-size: 15px;
        }

        #message-input::placeholder { color: #8991a2; }

        #send-button {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #9174ff, #5c63ed);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        #send-button:hover:not(:disabled) { filter: brightness(1.12); }
        #send-button:disabled { opacity: .55; cursor: not-allowed; }

        .footer-note {
            margin: 10px auto 0;
            max-width: 850px;
            color: #777f90;
            text-align: center;
            font-size: 11px;
        }

        /* Mobile sidebar drawer */
        .sidebar-backdrop {
            display: none;
        }

        @media (max-width: 700px) {
            .sidebar {
                position: fixed;
                inset: 0 auto 0 0;
                z-index: 20;
                width: min(280px, 85vw);
                height: 100dvh;
                transform: translateX(-105%);
                transition: transform .25s ease;
                box-shadow: none;
            }

            .sidebar.open { transform: translateX(0); }

            .sidebar-backdrop.open {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 15;
                background: #0009;
            }

            .sidebar-toggle {
                display: block;
                flex-shrink: 0;
            }

            header { padding: 12px 13px; gap: 10px; }
            header h2 { font-size: 16px; }
            .subtitle { font-size: 11px; }
            #messages { padding: 20px 12px; }
            .message { gap: 9px; margin-bottom: 20px; }
            .avatar { width: 30px; height: 30px; font-size: 14px; }

            .bubble {
                max-width: calc(100% - 39px);
                padding: 10px 12px;
                font-size: 14px;
            }

            .bot .bubble { padding: 2px 0; }
            .input-area { padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); }
            #chat-form { gap: 5px; padding: 5px; border-radius: 15px; }
            #message-input { padding: 11px 8px; font-size: 14px; }
            #send-button { padding: 11px 12px; font-size: 13px; }
            .footer-note { font-size: 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">✦</div>
                <span>Groq AI</span>
            </div>

            <button type="button" class="new-chat" id="new-chat">
                <span>＋</span> New chat
            </button>

            <p class="history-heading">Recent chats</p>
            <div id="chat-history" class="chat-history">
                <p class="empty-history">Your conversations will appear here.</p>
            </div>

            <div class="sidebar-footer">Groq AI Assistant</div>
        </aside>

        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <main class="chat-container">
            <header>
                <button type="button" id="sidebar-toggle" class="sidebar-toggle"
                        aria-label="Open chat history" aria-expanded="false">☰</button>

                <div class="header-info">
                    <h2>Groq AI Assistant</h2>
                    <p class="subtitle">Ask anything. Learn something new.</p>
                </div>
            </header>

            <div id="messages" aria-live="polite">
                <div class="message bot">
                    <div class="avatar">✦</div>
                    <div class="bubble">
                        <strong>Hello! 👋</strong>
                        <p>Welcome to Groq AI Assistant.</p>
                        Ask me anything. I'm here to help you!
                    </div>
                </div>
            </div>

            <div class="input-area">
                <form id="chat-form">
                    {% csrf_token %}
                    <input id="message-input" type="text"
                           placeholder="Message your AI assistant..."
                           maxlength="4000" autocomplete="off"
                           aria-label="Type your message" required>
                    <button id="send-button" type="submit">
                        Send <span>➤</span>
                    </button>
                </form>
                <p class="footer-note">
                    AI can make mistakes. Please verify important information.
                </p>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const messages = document.getElementById("messages");
        const button = document.getElementById("send-button");
        const sidebar = document.getElementById("sidebar");
        const sidebarToggle = document.getElementById("sidebar-toggle");
        const backdrop = document.getElementById("sidebar-backdrop");
        const newChatButton = document.getElementById("new-chat");
        const historyContainer = document.getElementById("chat-history");

        /*
         * This history is stored in this browser using localStorage.
         * It stores the visible conversation; the Django /chat/ endpoint
         * remains responsible for generating assistant replies.
         */
        const STORAGE_KEY = "groq_ai_chat_history_v1";
        let conversations = loadConversations();
        let currentChatId = null;
        let requestInProgress = false;

        function makeId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
        }

        function loadConversations() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                return Array.isArray(saved) ? saved.filter(chat =>
                    chat && typeof chat.id === "string" && Array.isArray(chat.messages)
                ) : [];
            } catch (error) {
                console.warn("Could not read saved chat history.", error);
                return [];
            }
        }

        function saveConversations() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
            } catch (error) {
                console.warn("Could not save chat history in this browser.", error);
            }
        }

        function closeSidebar() {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            sidebarToggle.setAttribute("aria-expanded", "false");
        }

        function toggleSidebar() {
            const isOpen = sidebar.classList.toggle("open");
            backdrop.classList.toggle("open", isOpen);
            sidebarToggle.setAttribute("aria-expanded", String(isOpen));
        }

        sidebarToggle.addEventListener("click", toggleSidebar);
        backdrop.addEventListener("click", closeSidebar);

        function createConversation() {
            const chat = {
                id: makeId(),
                title: "New chat",
                messages: [],
                updatedAt: Date.now()
            };
            conversations.unshift(chat);
            currentChatId = chat.id;
            saveConversations();
            renderHistory();
            renderConversation(chat);
            closeSidebar();
            input.focus();
        }

        function getCurrentConversation() {
            return conversations.find(chat => chat.id === currentChatId) || null;
        }

        function makeMessageElement(text, type, isHTML = false) {
            const row = document.createElement("div");
            row.className = "message " + type;

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.textContent = type === "user" ? "👤" : "✦";

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            if (isHTML) {
                bubble.innerHTML = DOMPurify.sanitize(text);
            } else {
                bubble.textContent = text;
            }

            row.append(avatar, bubble);
            return { row, bubble };
        }

        function addMessage(text, type, isHTML = false) {
            const item = makeMessageElement(text, type, isHTML);
            messages.appendChild(item.row);
            // scrollToBottom();
            return item.bubble;
        }

        // function scrollToBottom() {
        //     messages.scrollTop = messages.scrollHeight;
        // }

        function renderConversation(chat) {
            messages.replaceChildren();

            if (!chat || chat.messages.length === 0) {
                const welcome = makeMessageElement(
                    "<strong>Hello! 👋</strong><p>Welcome to Groq AI Assistant.</p>Ask me anything. I'm here to help you!",
                    "bot",
                    true
                );
                messages.appendChild(welcome.row);
            } else {
                chat.messages.forEach(message => {
                    const isBotHTML = message.role === "assistant";
                    let content = message.content;

                    if (isBotHTML && window.marked && window.DOMPurify) {
                        content = DOMPurify.sanitize(marked.parse(content || ""));
                    }
                    const item = makeMessageElement(
                        content,
                        message.role === "user" ? "user" : "bot",
                        isBotHTML
                    );
                    messages.appendChild(item.row);
                });
            }

            // scrollToBottom();
        }

        function renderHistory() {
            historyContainer.replaceChildren();

            if (conversations.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty-history";
                empty.textContent = "Your conversations will appear here.";
                historyContainer.appendChild(empty);
                return;
            }

            conversations
                .slice()
                .sort((a, b) => b.updatedAt - a.updatedAt)
                .forEach(chat => {
                    const item = document.createElement("button");
                    item.type = "button";
                    item.className = "history-item" +
                        (chat.id === currentChatId ? " active" : "");
                    item.textContent = chat.title || "New chat";
                    item.title = chat.title || "New chat";
                    item.addEventListener("click", () => {
                        if (requestInProgress) return;
                        currentChatId = chat.id;
                        renderHistory();
                        renderConversation(chat);
                        closeSidebar();
                    });
                    historyContainer.appendChild(item);
                });
        }

        function persistMessage(role, content) {
            const chat = getCurrentConversation();
            if (!chat) return;

            chat.messages.push({ role, content });
            chat.updatedAt = Date.now();

            if (role === "user" && (chat.title === "New chat" || !chat.title)) {
                chat.title = content.trim().slice(0, 42) || "New chat";
            }

            saveConversations();
            renderHistory();
        }

        function showTyping() {
            return addMessage(
                '<div class="typing" aria-label="AI is thinking">' +
                    '<span></span><span></span><span></span>' +
                '</div>',
                "bot",
                true
            );
        }

        newChatButton.addEventListener("click", () => {
            if (requestInProgress) return;
            createConversation();
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = input.value.trim();
            if (!message || requestInProgress) return;

            if (!currentChatId) {
                createConversation();
            }

            persistMessage("user", message);
            addMessage(message, "user");

            input.value = "";
            requestInProgress = true;
            button.disabled = true;
            input.disabled = true;

            const originalButtonHTML = button.innerHTML;
            button.textContent = "Thinking...";

            const loading = showTyping();

            try {
                const csrfInput = document.querySelector("[name=csrfmiddlewaretoken]");
                if (!csrfInput) {
                    throw new Error("CSRF token not found. Check your Django template.");
                }

                const response = await fetch("/chat/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfInput.value
                    },
                    body: JSON.stringify({ message })
                });

                let data;
                try {
                    data = await response.json();
                } catch (error) {
                    throw new Error("The server returned an invalid response.");
                }

                if (!response.ok) {
                    throw new Error(data.error || "Request failed. Please try again.");
                }

                const reply = data.reply || "No response received.";
                loading.innerHTML = DOMPurify.sanitize(marked.parse(reply));
                persistMessage("assistant", reply);
                // scrollToBottom();
            } catch (error) {
                const errorMessage = error.message === "Failed to fetch"
                    ? "Could not connect to the server. Please check that Django is running."
                    : (error.message || "Something went wrong. Please try again.");

                loading.textContent = errorMessage;
                persistMessage("assistant", errorMessage);
            } finally {
                requestInProgress = false;
                button.disabled = false;
                input.disabled = false;
                button.innerHTML = originalButtonHTML;
                input.focus();
                renderHistory();
            }
        });

        // Restore the latest conversation on page load.
        if (conversations.length > 0) {
            conversations.sort((a, b) => b.updatedAt - a.updatedAt);
            currentChatId = conversations[0].id;
            renderConversation(conversations[0]);
        } else {
            createConversation();
        }

        renderHistory();
    </script>
</body>
</html>
